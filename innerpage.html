                    </a>

        <div class="col1 col-10">
            <div class="heading mt-4">
                <h3>Analysis</h3>
            </div>
            
            <!-- One Column -->

            <div class="form mt-4">
                <form>
                    <div class="form-group">
                      <label for="Name ">One Column</label>
                      <input type="email" class="form-control" id="Name" placeholder="Name">
                    </div>
                    <div class="form-group mt-3">
                        <select id="Dropdown" class="form-control">
                          <option selected>Dropdown
                          </option>
                          <option>...</option>
                        </select>
                      </div>

            <!-- Two Column -->
                    <div class="form-group mt-3">
                      <textarea class="form-control" id="MultipleLine" rows="3">Multiple Line</textarea>
                    </div>

                    <div class="form-group mt-4">
                        <label for="Two-Column">Two Column</label>
                    </div>
                    <div class="form row">
                        <div class="col-6 mb-3 ">
                            <input type="text" class="form-control" id="Name" placeholder="Name" >
                        </div>
                        <div class="col-6 mb-3 ">
                            <input type="text" class="form-control" id="username" placeholder="username" Value="johndoe" >
                        </div>
                    </div>

                    <div class="form row">
                        <div class="col-6 mb-3 ">
                            <input type="password" class="form-control" id="password" placeholder="password">
                        </div>
                        <div class="col-6 mb-3 ">
                            <select id="Dropdown" class="form-control">
                                <option  selected>Dropdown</option>
                                <option >...</option>
                            </select>
                        </div>
                    </div>

                    <!-- Third Column -->

                    <div class="form row">
                        <div class="form-group mb-2 mt-3">
                            <label for="Third-column ">Third Column</label>
                        </div>
                        <div class="col-4 mb-3">
                            <input type="text" class="form-control" id="focus">
                        </div>
                        <div class="col-4 mb-3 ">
                            <input type="password" class="form-control" id="password" placeholder="password">
                        </div>
                        <div class="col-4 mb-3">
                            <input type="text" class="form-control" id="disable" Value="JohnDao " disabled>
                        </div>
                    </div>

                    <!-- Four Column -->

                    <div class="form-group mt-4">
                        <label for="Two-Column">Four Column</label>
                    </div>
                    
                    <div class="form row">
                        <div class="col-3 mb-3">
                            <input type="text" class="form-control" id="Designation " placeholder="Designation">
                        </div>
                        <div class="col-3 mb-3"><input type="text" class="form-control" id="Name" placeholder="Enter your full Name as per ID "></div>
                            
                        <div class="col-3 mb-3"> <input type="text" class="form-control" id="Username" placeholder="Username" Value="JohnDao"></div>
                        <div class="col-3 mb-3">
                            <select class="form-control" >
                                <option></option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group mt-4">
                        <label for="other" class="other" id="other">Other Design Eelments</label>
                       
                    </div>
                    <!-- <div class="form">
                        <label for="file">Files Upload</label>
                         <div class="form row">
                            <button class="filebtn">
                                <label for="fbtn" class="btn ">
                                    <input type="file" class="upload" id="file" >
                                </label>
                               
                            </button>
                            
                        </div>
                        
                     </div> -->
                     <div class="form-group mt-4">
                        <label for="files" class="files" id="files">File Upload</label>
                        <div class="form ">
                            <label for="fbtn" class="btn btn-primary">
                                <input type="file" class="upload" id="file">
                            </label>
                         </div>
                    </div>

                    <div class="form-group mt-4  ">
                        <label for="radiobutton" class="radio" id="radio">Radio Button</label>
                        <div class="form ">
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="inlineRadioOptions" id="" value="option1">
                                <label class="form-check-label" for="inlineRadio1">option 1</label>
                               </div>
                              <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2" value="option2">
                                <label class="form-check-label" for="inlineRadio2">option 2</label>
                              </div>
                        </div>
                       
                    </div>

                    <div class="form-group mt-4  ">
                        <label for="Checkbox" class="check" id="check">Checkbox</label>
                        <div class="form ">
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="inlineCheckbox1" value="option1">
                                <label class="form-check-label" for="inlineCheckbox1">option 1</label>
                              </div>
                              <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="inlineCheckbox2" value="option2">
                                <label class="form-check-label" for="inlineCheckbox2">option 2</label>
                              </div>
                        </div>
                       
                    </div>

                    <div class="form-group mt-4">
                        <label for="snackbar" class="snack" id="snack">Snackbar</label>

                    </div>
                        <div class="form row">
                            <div class="col-6 mb-3 ">
                                <!-- <span class="fa-solid fa-circle-exclamation"></span> -->
                                <input type="text" class="form-control" id="error" placeholder="This is an error message" >
                            </div>
                            <div class="col-6 mb-3 ">
                                <input type="text" class="form-control" id="information"placeholder="This is an information message">
                            </div>
                        </div>

                        <div class="form row">
                            <div class="col-6 mb-3 ">
                                <input type="text" class="form-control" id="warning" placeholder="This is an warning message" >
                            </div>
                            <div class="col-6 mb-3 ">
                                <input type="text" class="form-control" id="success" placeholder="This is an Success message">
                            </div>
                        </div>

                        <div class="form-group mt-4">
                            <label for="snackbar" class="snack" id="snack">call to action</label>
                            
                        </div>
                        <div class="form row m-2 gap-2">
                            <button type="button" class="btn btn-primary btn-sm">primary</button>
                            <button type="button" class="btn btn-secondary btn-sm">secondary</button>

                        </div>

                        <div class="form-group mt-4">
                            <label for="Tabs" class="Tabs" id="Tabs">Tabs</label>
                            
                        </div>


                     <div>

                     </div>
                    
                  </form>
