<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
 
<body>
    <div class="container">
        <div class="row">
            <div class="col-md">
                <img class="frt-img" src="images/hero-image.png" alt="">
            </div>
            <div class="col offset-1">
                <div class="col">
                    <img class="logo" src="images/logo.svg" alt="">
                </div>
                <div class="col">
                    <p>
                    <h3 class="slogan">We are <span>expert</span> in business,<br>marketing,growth & sales.</h3>
                    </p>
                    <p>
                    <h4 class="login-suggest">Login into your account</h4>
                    </p>
                </div>
                <form>
                    <div class="form-group col-9 m-1 py-2">
                        <input type="email" class="form-control fonts" id="Username" aria-describedby="emailHelp"
                            placeholder="Username">
                    </div>
                    <div class="form-group col-9 m-1">
                        <input type="password" class="form-control fonts " id="exampleInputPassword1"
                            placeholder="Password">
                    </div>
                    <div class="row" id="login_pwd">
                        <div class="col fonts">
                            <button type="submit" class="btn-danger mt-2 login" >Login</button>
                        </div>
                        <div class="col fonts mr-5 mt-2" id="forgot_pwd">Forgot password?
                        </div>
                    </div>
                    <div class="row ml-3 mt-2">
                        <h6 class="member fonts">Are you new member?<span>Register Here</span></h6>
                    </div>
            </div>
        </div>
        </form>
    </div>
 
</body>
 
</html>
